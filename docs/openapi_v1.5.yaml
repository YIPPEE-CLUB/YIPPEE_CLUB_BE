openapi: 3.0.3
info:
  title: YIPPEE CLUB API
  version: '1.5'
  description: 팀 공유용 v1.5 Markdown 명세서에서 변환. 미확정 필드/정책은 원문 검토 필요. 99개 API 중 일부는 후속 개발 대상입니다.
servers:
- url: /api/v1
tags:
- name: 인증
- name: 사용자·아이
- name: 활동지·검색
- name: 찜
- name: 장바구니·결제
- name: 쿠폰·포인트
- name: 리뷰·기록·배지
- name: 콘텐츠·이벤트
- name: 알림
- name: 고객센터
- name: 앱 설정
paths:
  /auth/identifiers/check:
    post:
      tags:
      - 인증
      summary: 01. 이메일/전화번호 가입 여부 확인
      operationId: api01_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    type: boolean
                    description: registered 값
                    example: true
                  identifier_type:
                    type: string
                    description: identifier type 값
                    example: email
                required:
                - registered
                - identifier_type
              example:
                registered: true
                identifier_type: email
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: identifier 값
                  example: user@example.com
              required:
              - identifier
            example:
              identifier: user@example.com
  /auth/verification/send:
    post:
      tags:
      - 인증
      summary: 02. 이메일/휴대전화 인증번호 발송(가입 방식별 정책 확정 필요)
      operationId: api02_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        **v1.5 확정:** 1차 가입 인증은 이메일로 발송합니다. 인증번호 확인은 필수이며 발송 제한·만료 시간은 별도 검토합니다.'
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_id:
                    type: string
                    description: verification id 값
                    example: ver_test_001
                  expires_in_seconds:
                    type: integer
                    description: expires in seconds 값
                    example: 1
                required:
                - verification_id
                - expires_in_seconds
              example:
                verification_id: ver_test_001
                expires_in_seconds: 1
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: identifier 값
                  example: user@example.com
                purpose:
                  type: string
                  description: purpose 값
                  example: signup
              required:
              - identifier
              - purpose
            example:
              identifier: user@example.com
              purpose: signup
  /auth/identity/start:
    post:
      tags:
      - 인증
      summary: 03. 실명 본인확인 시작(외부 인증사 연동 제안)
      operationId: api03_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '201':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_url:
                    type: string
                    description: verification url 값
                    example: (미확정 예시)
                  transaction_id:
                    type: string
                    description: transaction id 값
                    example: txn_test_001
                required:
                - verification_url
                - transaction_id
              example:
                verification_url: UNSPECIFIED
                transaction_id: txn_test_001
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  description: purpose 값
                  example: signup
              required:
              - purpose
            example:
              purpose: signup
  /auth/identity/confirm:
    post:
      tags:
      - 인증
      summary: 04. 본인확인 결과 검증(인증사 연동 제안)
      operationId: api04_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity_verification_token:
                    type: string
                    description: identity verification token 값
                    example: identity_test_001
                  verified:
                    type: boolean
                    description: verified 값
                    example: true
                required:
                - identity_verification_token
                - verified
              example:
                identity_verification_token: identity_test_001
                verified: true
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                  description: transaction id 값
                  example: txn_test_001
                provider_token:
                  type: string
                  description: provider token 값
                  example: provider_test_token
              required:
              - transaction_id
              - provider_token
            example:
              transaction_id: txn_test_001
              provider_token: provider_test_token
  /auth/verification/confirm:
    post:
      tags:
      - 인증
      summary: 05. 6자리 인증번호 검증
      operationId: api05_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        **v1.5 확정:** 이메일 인증번호 검증 성공 시 가입에 사용할 일회성 `verification_token`을 발급하고 재사용을 금지합니다.'
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_token:
                    type: string
                    description: verification token 값
                    example: vtoken_test_001
                  verified:
                    type: boolean
                    description: verified 값
                    example: true
                required:
                - verification_token
                - verified
              example:
                verification_token: vtoken_test_001
                verified: true
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verification_id:
                  type: string
                  description: verification id 값
                  example: ver_test_001
                code:
                  type: string
                  description: code 값
                  example: 123456
              required:
              - verification_id
              - code
            example:
              verification_id: ver_test_001
              code: '123456'
  /auth/signup:
    post:
      tags:
      - 인증
      summary: 06. 회원가입 완료
      operationId: api06_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        **v1.5 확정:** 이메일·비밀번호 가입만 우선 구현합니다. 이메일 인증 완료 `verification_token`이 필수이고, 이메일 가입에서 `password`는 **필수**입니다.
        아래 기존 표의 `password 선택` 표기보다 이 규칙이 우선합니다.'
      responses:
        '201':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    description: user id 값
                    example: 1
                  access_token:
                    type: string
                    description: access token 값
                    example: eyJ...
                  refresh_token:
                    type: string
                    description: refresh token 값
                    example: eyJ...
                required:
                - user_id
                - access_token
                - refresh_token
              example:
                user_id: 1
                access_token: eyJ...
                refresh_token: eyJ...
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: identifier 값
                  example: user@example.com
                verification_token:
                  type: string
                  description: verification token 값
                  example: vtoken_test_001
                agreements:
                  type: object
                  description: agreements 값
                  example: {}
                password:
                  type: string
                  description: password 값
                  nullable: true
                  example: Password123
              required:
              - identifier
              - verification_token
              - agreements
            example:
              identifier: user@example.com
              verification_token: vtoken_test_001
              agreements: {}
              password: Password123
  /auth/login:
    post:
      tags:
      - 인증
      summary: 07. 이메일·비밀번호 로그인
      operationId: api07_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: access token 값
                    example: eyJ...
                  refresh_token:
                    type: string
                    description: refresh token 값
                    example: eyJ...
                  user:
                    type: object
                    description: user 값
                    example: {}
                required:
                - access_token
                - refresh_token
                - user
              example:
                access_token: eyJ...
                refresh_token: eyJ...
                user: {}
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: email 값
                  example: user@example.com
                password:
                  type: string
                  description: password 값
                  example: Password123
              required:
              - email
              - password
            example:
              email: user@example.com
              password: Password123
  /auth/social/{provider}:
    post:
      tags:
      - 인증
      summary: 08. 카카오·네이버·Apple 로그인
      operationId: api08_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '201':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: access token 값
                    example: eyJ...
                  refresh_token:
                    type: string
                    description: refresh token 값
                    example: eyJ...
                  is_new_user:
                    type: boolean
                    description: is new user 값
                    example: true
                required:
                - access_token
                - refresh_token
                - is_new_user
              example:
                access_token: eyJ...
                refresh_token: eyJ...
                is_new_user: true
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 대상 리소스를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization_code:
                  type: string
                  description: authorization code 값
                  example: (미확정 예시)
                redirect_uri:
                  type: string
                  description: redirect uri 값
                  nullable: true
                  example: (미확정 예시)
              required:
              - authorization_code
            example:
              authorization_code: UNSPECIFIED
              redirect_uri: UNSPECIFIED
  /auth/token/refresh:
    post:
      tags:
      - 인증
      summary: 09. 토큰 갱신
      operationId: api09_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: access token 값
                    example: eyJ...
                  refresh_token:
                    type: string
                    description: refresh token 값
                    example: eyJ...
                required:
                - access_token
                - refresh_token
              example:
                access_token: eyJ...
                refresh_token: eyJ...
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: refresh token 값
                  example: eyJ...
              required:
              - refresh_token
            example:
              refresh_token: eyJ...
  /auth/logout:
    post:
      tags:
      - 인증
      summary: 10. 로그아웃
      operationId: api10_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: message 값
                    example: 처리되었습니다.
                required:
                - message
              example:
                message: 처리되었습니다.
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 인증 시도 횟수 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: refresh token 값
                  nullable: true
                  example: eyJ...
            example:
              refresh_token: eyJ...
  /auth/password/reset-request:
    post:
      tags:
      - 인증
      summary: 11. 비밀번호 재설정 메일
      operationId: api11_post
      description: '1차 핵심 또는 후속 개발 여부는 원문 0절 참조.

        '
      responses:
        '200':
          description: 정상 처리
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: message 값
                    example: 처리되었습니다.
                required:
                - message
              example:
                message: 처리되었습니다.
        '400':
          description: 요청 형식 또는 필수값 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 중복 요청 또는 처리 불가능한 상태
          content:
